<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Markdown Extractor</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 12px;
      padding: 0;
      color: #ffffff;
      background: linear-gradient(135deg, #1e3a8a, #7e22ce, #d946ef);
      /* Prevent the popup from scrolling unnecessarily if content fits */
      box-sizing: border-box;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      background-color: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.5);
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
    }

    #status {
      margin-top: 16px;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      min-height: 20px;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: transparent;
      border: none;
      display: none;
      color: #ffffff;
    }
    .error {
      color: #fca5a5 !important;
    }
    .success {
      color: #a7f3d0 !important;
    }
  </style>
</head>
<body>
  <div class="glass-panel">
    <h2>Job Details Extractor</h2>
    <button id="extractBtn">Extract Job to Markdown</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
